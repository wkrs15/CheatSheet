<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"
     aria-label="CheatSheet 界面示意:屏幕顶端的控制条 + 压在游戏画面上的置顶小窗">
  <defs>
    <!-- 自己带一套深浅色,不跟着 GitHub 的明暗主题变 -->
    <style>
      text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
      .label { fill: #9aa5b1; font-size: 14px; }
      .hint  { fill: #5b6570; font-size: 13px; }
      .name  { fill: #dbe3ec; font-size: 15px; font-weight: 600; }
      .url   { fill: #7d8894; font-size: 12px; }
      .tag   { fill: #58a6ff; font-size: 11px; }
      .btn   { fill: #262d37; }
      .icon  { fill: #aeb8c4; }
      .dot   { fill: #2e90ff; }
      .lead  { stroke: #2e90ff; stroke-opacity: .45; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="16" fill="#0e1116"/>

  <!-- ================= 屏幕最顶端:控制条 ================= -->
  <text class="label" x="40" y="30">屏幕最顶端</text>

  <rect x="40" y="42" width="820" height="80" rx="14" fill="#171b21" stroke="#2a313a"/>

  <!-- 地址栏那一行(切到网页模式才出现) -->
  <rect x="58" y="55" width="16" height="24" rx="6" fill="#212731"/>
  <rect x="70" y="55" width="508" height="24" rx="0" fill="#212731"/>
  <rect x="574" y="55" width="16" height="24" rx="6" fill="#212731"/>
  <circle cx="70" cy="67" r="3.5" fill="none" stroke="#7d8894" stroke-width="1.3"/>
  <path d="M72.5 69.5 l4 4" stroke="#7d8894" stroke-width="1.3" fill="none"/>
  <text class="url" x="84" y="71">https://www.bilibili.com</text>
  <rect x="586" y="55" width="46" height="24" rx="6" fill="#2b323d"/>
  <text class="url" x="598" y="71">前往</text>
  <text class="tag" x="646" y="71">← 网页模式才有这一行</text>

  <!-- 按钮行(图标从左到右:打开 / 上一集 / 播放 / 下一集 / 快退 / 快进 / 倍速 / 音量 … 设置 / 退出) -->
  <rect class="btn" x="58"  y="88" width="30" height="22" rx="6"/>
  <path class="icon" d="M67 94 l8 5 -8 5 z" transform="rotate(-45 71 99)"/>
  <rect class="btn" x="92"  y="88" width="30" height="22" rx="6"/>
  <path class="icon" d="M104 94 l8 5 -8 5 z" transform="rotate(180 108 99)"/>
  <rect class="btn" x="126" y="88" width="30" height="22" rx="6"/>
  <path class="icon" d="M137 93.5 l9 5.5 -9 5.5 z"/>
  <rect class="btn" x="160" y="88" width="30" height="22" rx="6"/>
  <path class="icon" d="M173 94 l8 5 -8 5 z"/>
  <rect class="btn" x="194" y="88" width="30" height="22" rx="6"/>
  <text class="url" x="199" y="103" fill="#aeb8c4">-5s</text>
  <rect class="btn" x="228" y="88" width="30" height="22" rx="6"/>
  <text class="url" x="233" y="103" fill="#aeb8c4">+5s</text>
  <rect class="btn" x="270" y="88" width="40" height="22" rx="6"/>
  <text class="url" x="278" y="103" fill="#aeb8c4">1x</text>
  <!-- 音量滑条 -->
  <rect x="322" y="93" width="80" height="12" rx="6" fill="#2b323d"/>
  <rect x="322" y="93" width="26" height="12" rx="6" fill="#2e90ff"/>
  <circle cx="348" cy="99" r="6" fill="#c7d0da"/>
  <rect class="btn" x="800" y="88" width="30" height="22" rx="6"/>
  <circle cx="815" cy="99" r="4" fill="none" stroke="#aeb8c4" stroke-width="1.5"/>
  <rect x="815" y="97.5" width="0.1" height="3" stroke="#aeb8c4" stroke-width="1.5"/>
  <rect class="btn" x="834" y="88" width="26" height="22" rx="6"/>
  <rect x="842" y="94" width="10" height="10" rx="1.5" fill="none" stroke="#aeb8c4" stroke-width="1.5"/>
  <path d="M844.5 94 v-2.5 h5 v2.5" stroke="#aeb8c4" stroke-width="1.5" fill="none"/>

  <text class="hint" x="40" y="142">控制条:鼠标移到屏幕顶端才出现 · 点它不抢游戏焦点 · 全局热键在游戏全屏时照样生效</text>

  <!-- ================= 游戏画面 ================= -->
  <rect x="40" y="162" width="430" height="272" rx="14" fill="#12161c" stroke="#2a313a" stroke-dasharray="7 6"/>
  <!-- 几块游戏感的元素:地面、掩体、准星 -->
  <rect x="48" y="380" width="414" height="46" fill="#1a2230"/>
  <rect x="300" y="330" width="70" height="50" fill="#222c3d"/>
  <rect x="90"  y="348" width="52" height="32" fill="#1e2735"/>
  <circle cx="250" cy="300" r="7" fill="none" stroke="#4a5a72" stroke-width="1.5"/>
  <path d="M250 288 v8 M250 304 v8 M238 300 h8 M254 300 h8" stroke="#4a5a72" stroke-width="1.5"/>
  <text class="hint" x="60" y="186">游戏画面(可以全屏)</text>

  <!-- 压在上面的置顶小窗 -->
  <rect x="68" y="200" width="344" height="198" rx="10" fill="#05070a" stroke="#3a424c"/>
  <path d="M225 284 l30 15 -30 15 z" fill="#2a323c"/>
  <!-- 拖边角 = 缩放 的提示角标 -->
  <path d="M404 382 h-8 M404 382 v-8 M404 374 l-8 8" stroke="#58a6ff" stroke-width="1.5" fill="none"/>

  <!-- 贴着小窗底边的进度条 -->
  <rect x="76" y="392" width="328" height="3" rx="1.5" fill="#ffffff2b"/>
  <rect x="76" y="392" width="96" height="3" rx="1.5" fill="#2e90ff"/>
  <circle cx="172" cy="393.5" r="5" fill="#ffffff"/>

  <!-- ================= 说明(带引导线,指到图上对应的元素) ================= -->
  <text class="name" x="520" y="216">置顶小窗</text>

  <circle class="dot" cx="526" cy="252" r="3"/>
  <path class="lead" d="M414 252 H520"/>
  <text class="label" x="540" y="257">只有画面 + 进度条,没有标题栏</text>

  <circle class="dot" cx="526" cy="290" r="3"/>
  <path class="lead" d="M414 290 H520"/>
  <text class="label" x="540" y="295">画面可以半透明,透出后面的游戏</text>

  <circle class="dot" cx="526" cy="328" r="3"/>
  <path class="lead" d="M414 328 H520"/>
  <text class="label" x="540" y="333">按住画面拖动 = 移动窗口</text>

  <circle class="dot" cx="526" cy="366" r="3"/>
  <path class="lead" d="M406 366 H520"/>
  <text class="label" x="540" y="371">拖边角 = 等比例缩放</text>

  <circle class="dot" cx="526" cy="404" r="3"/>
  <path class="lead" d="M182 402 C 320 420 420 404 520 404"/>
  <text class="label" x="540" y="409">同一块画面也能切成内置浏览器看网页</text>
</svg>
