<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"
     aria-label="CheatSheet 界面示意:屏幕顶端的控制条 + 压在游戏画面上的置顶小窗">
  <defs>
    <!-- 自己带一套深浅色,不跟着 GitHub 的明暗主题变 -->
    <style>
      text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
      .label { fill: #9aa5b1; font-size: 14px; }
      .hint  { fill: #5b6570; font-size: 13px; }
      .name  { fill: #dbe3ec; font-size: 15px; font-weight: 600; }
      .bar   { fill: #e8edf2; }
      .dim   { fill: #93a0ad; }
      .url   { fill: #7d8894; font-size: 12px; }
      .lead  { stroke: #2e90ff; stroke-opacity: .45; stroke-width: 1.2; fill: none; }
      .dot   { fill: #2e90ff; }
      .sep   { fill: #33ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="16" fill="#0e1116"/>

  <!-- ================= 控制条:贴着屏幕顶边,只圆下面两个角 =================
       (矩形上沿伸出画布外,被视口裁掉,顶上两个直角就看不到了) -->
  <rect x="40" y="-12" width="820" height="98" rx="14" fill="#15171b" stroke="#2a313a"/>

  <!-- 地址栏:拉满整行(网页模式才有) -->
  <rect x="50" y="8" width="698" height="24" rx="6" fill="#2c313a"/>
  <text class="url" x="62" y="24">https://www.bilibili.com</text>
  <text class="bar" x="764" y="25" font-size="12">前往</text>

  <!-- 按钮行:标题 + 分隔线 + 一排透明按钮(悬停才有底色,所以平时看不到框) -->
  <text class="dim" x="54" y="62" font-size="12">把视频拖到这里开始播放</text>
  <rect class="sep" x="196" y="49" width="1" height="18"/>

  <!-- 打开文件 -->
  <path class="bar" d="M212 54 h7 l3 3 h9 v10 h-19 z"/>
  <!-- 上一集 -->
  <rect class="bar" x="248" y="53" width="2.5" height="14"/>
  <path class="bar" d="M263 53 l-10 7 10 7 z"/>
  <!-- 播放 -->
  <path class="bar" d="M283 52 l13 8 -13 8 z"/>
  <!-- 下一集 -->
  <path class="bar" d="M317 53 l10 7 -10 7 z"/>
  <rect class="bar" x="329" y="53" width="2.5" height="14"/>
  <!-- 快退 / 快进(文字钮) -->
  <text class="bar" x="342" y="62" font-size="12">-5s</text>
  <text class="bar" x="388" y="62" font-size="12">+5s</text>
  <rect class="sep" x="438" y="49" width="1" height="18"/>
  <!-- 倍速 -->
  <text class="bar" x="452" y="62" font-size="12">1x</text>
  <!-- 静音 -->
  <path class="bar" d="M498 55 h5 l7 -6 v18 l-7 -6 h-5 z"/>
  <!-- 音量滑条 -->
  <rect x="522" y="57" width="80" height="3" rx="1.5" fill="#3a424c"/>
  <rect x="522" y="57" width="58" height="3" rx="1.5" fill="#2e90ff"/>
  <circle cx="580" cy="58.5" r="5" fill="#e8edf2"/>
  <rect class="sep" x="616" y="49" width="1" height="18"/>
  <!-- 设置(齿轮) -->
  <circle cx="638" cy="58" r="5" fill="none" stroke="#e8edf2" stroke-width="1.6"/>
  <circle cx="638" cy="58" r="1.6" fill="#e8edf2"/>
  <g stroke="#e8edf2" stroke-width="1.6">
    <path d="M638 50.5 v3 M638 62.5 v3 M630.5 58 h3 M642.5 58 h3
             M632.9 52.9 l2.1 2.1 M641 61.1 l2.1 2.1 M643.1 52.9 l-2.1 2.1 M635 61.1 l-2.1 2.1"/>
  </g>
  <!-- 退出 -->
  <rect x="664" y="51" width="12" height="14" rx="2" fill="none" stroke="#e8edf2" stroke-width="1.6"/>
  <path d="M661 58 h9 m-3.5 -3.5 l3.5 3.5 -3.5 3.5" stroke="#e8edf2" stroke-width="1.6" fill="none"/>

  <text class="hint" x="40" y="112">控制条:贴在屏幕最顶端 · 鼠标移上去才出现 · 点它不抢游戏焦点 · 上面那行地址栏只有网页模式才有</text>

  <!-- ================= 游戏画面 ================= -->
  <rect x="40" y="130" width="430" height="272" rx="14" fill="#12161c" stroke="#2a313a" stroke-dasharray="7 6"/>
  <!-- 几块游戏感的元素:地面、掩体、准星 -->
  <rect x="48" y="348" width="414" height="46" fill="#1a2230"/>
  <rect x="300" y="298" width="70" height="50" fill="#222c3d"/>
  <rect x="90"  y="316" width="52" height="32" fill="#1e2735"/>
  <circle cx="250" cy="268" r="7" fill="none" stroke="#4a5a72" stroke-width="1.5"/>
  <path d="M250 256 v8 M250 272 v8 M238 268 h8 M254 268 h8" stroke="#4a5a72" stroke-width="1.5"/>
  <text class="hint" x="60" y="154">游戏画面(可以全屏)</text>

  <!-- 压在上面的置顶小窗 -->
  <rect x="68" y="168" width="344" height="198" rx="10" fill="#05070a" stroke="#3a424c"/>
  <path d="M225 252 l30 15 -30 15 z" fill="#2a323c"/>
  <!-- 拖边角 = 缩放 的提示角标 -->
  <path d="M404 350 h-8 M404 350 v-8 M404 342 l-8 8" stroke="#58a6ff" stroke-width="1.5" fill="none"/>

  <!-- 贴着小窗底边的进度条 -->
  <rect x="76" y="359" width="328" height="3" rx="1.5" fill="#ffffff2b"/>
  <rect x="76" y="359" width="96" height="3" rx="1.5" fill="#2e90ff"/>
  <circle cx="172" cy="360.5" r="5" fill="#ffffff"/>

  <!-- ================= 说明(带引导线,指到图上对应的元素) ================= -->
  <text class="name" x="520" y="184">置顶小窗</text>

  <circle class="dot" cx="526" cy="220" r="3"/>
  <path class="lead" d="M414 220 H520"/>
  <text class="label" x="540" y="225">只有画面 + 进度条,没有标题栏</text>

  <circle class="dot" cx="526" cy="258" r="3"/>
  <path class="lead" d="M414 258 H520"/>
  <text class="label" x="540" y="263">画面可以半透明,透出后面的游戏</text>

  <circle class="dot" cx="526" cy="296" r="3"/>
  <path class="lead" d="M414 296 H520"/>
  <text class="label" x="540" y="301">按住画面拖动 = 移动窗口</text>

  <circle class="dot" cx="526" cy="334" r="3"/>
  <path class="lead" d="M406 348 C 450 348 470 334 520 334"/>
  <text class="label" x="540" y="339">拖边角 = 等比例缩放</text>

  <circle class="dot" cx="526" cy="372" r="3"/>
  <path class="lead" d="M182 366 C 320 384 420 372 520 372"/>
  <text class="label" x="540" y="377">同一块画面也能切成内置浏览器看网页</text>
</svg>
