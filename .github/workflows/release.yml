name: Release

# 推 v* 标签时自动构建并发布 Release;也可以手动触发一次构建(不会发 Release)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CheatSheet.csproj

      - name: Build
        run: dotnet build CheatSheet.csproj -c Release --no-restore

      - name: Publish (win-x64)
        run: dotnet publish CheatSheet.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = "CheatSheet-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $name
          Write-Host "打包完成: $name"

      # 从 CHANGELOG.md 里抓出当前标签对应的那一段,作为 Release 说明。
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8

          # 匹配 "## [v0.4] ..." 到下一个 "## [" 之前的所有内容。
          $pattern = '(?ms)^##\s*\[' + [regex]::Escape($tag) + '\][^\r\n]*\r?\n(.*?)(?=^##\s*\[|\z)'
          $match = [regex]::Match($text, $pattern)

          if ($match.Success -and $match.Groups[1].Value.Trim().Length -gt 0) {
            $body = $match.Value.Trim()
            Write-Host "已从 CHANGELOG.md 提取 $tag 的说明"
          } else {
            # 没写就退化成一句提示,至少不会出现一个空白的 Release。
            $body = "本次改动详见仓库的 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。"
            Write-Host "CHANGELOG.md 里没有 $tag 的段落,已回退到默认说明"
          }

          $body | Set-Content -Path release-notes.md -Encoding UTF8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatSheet-win-x64
          path: CheatSheet-*-win-x64.zip

      # 只有推标签时才发 Release
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CheatSheet ${{ github.ref_name }}
          files: CheatSheet-*-win-x64.zip
          body_path: release-notes.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
